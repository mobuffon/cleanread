# =============================================================================
# CleanRead Docker Compose - Services Only
# =============================================================================
#
# Use this when running backend natively (e.g., for M1/M2/M3 GPU acceleration)
#
# Usage:
#   docker-compose -f docker-compose.services-only.yml up -d
#   docker-compose -f docker-compose.services-only.yml down
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cleanread_postgres
    environment:
      POSTGRES_USER: cleanread
      POSTGRES_PASSWORD: cleanread_dev
      POSTGRES_DB: cleanread
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanread"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Message Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cleanread_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frontend (optional - can also run with npm run dev)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanread_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://host.docker.internal:8000

volumes:
  postgres_data:
  redis_data:
